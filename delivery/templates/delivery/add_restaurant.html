{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Restaurant - FoodFusion</title>

    <link rel="stylesheet" href="{% static 'delivery/admin.css' %}">

</head>


<body>


    <div class="admin-page">


        <section class="menu-card">


            <div class="card-heading">

                <div>

                    <span>
                        FOODFUSION ADMIN
                    </span>

                    <h2>
                        Add Restaurant
                    </h2>

                </div>

            </div>


            <form action="{% url 'add_restaurant' %}" method="POST">

                {% csrf_token %}


                <!-- RESTAURANT NAME -->

                <label>
                    Restaurant Name
                </label>

                <input type="text" name="name" placeholder="Enter restaurant name" required>


                <!-- PICTURE -->

                <label>
                    Picture URL
                </label>

                <input type="url" name="picture" placeholder="https://example.com/image.jpg" required>


                <!-- CUISINE -->

                <label>
                    Cuisine
                </label>

                <input type="text" name="cuisine" placeholder="Indian, Chinese, Italian..." required>


                <!-- RATING -->

                <label>
                    Rating
                </label>

                <input type="number" name="rating" min="0" max="5" step="0.1" placeholder="4.5" required>


                <br>


                <button type="submit" class="back-btn">

                    + Add Restaurant

                </button>


            </form>


            <br>


            <a href="{% url 'admin_home' %}" class="back-btn">

                ← Back to Dashboard

            </a>


        </section>


    </div>


</body>

</html>
